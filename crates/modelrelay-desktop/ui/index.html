<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelRelay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .status-card {
      background: #1a1b23;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      background: #ef4444;
    }
    .status-indicator.connected { background: #22c55e; }
    .label { font-size: 12px; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
    .value { font-size: 14px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    #models { margin-top: 12px; }
    .model-tag {
      display: inline-block;
      background: #27272a;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      margin: 2px;
    }
  </style>
</head>
<body>
  <h1>ModelRelay</h1>

  <div class="status-card">
    <div>
      <span id="statusDot" class="status-indicator"></span>
      <span id="statusText">Disconnected</span>
    </div>
    <div class="grid">
      <div>
        <div class="label">Relay</div>
        <div class="value" id="relayUrl">-</div>
      </div>
      <div>
        <div class="label">Active Requests</div>
        <div class="value" id="activeRequests">0</div>
      </div>
    </div>
    <div id="models"></div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function refreshStatus() {
      try {
        const status = await invoke("get_status");
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        dot.className = "status-indicator" + (status.connected ? " connected" : "");
        text.textContent = status.connected ? "Connected" : "Disconnected";
        document.getElementById("relayUrl").textContent = status.relay_url || "-";
        document.getElementById("activeRequests").textContent = status.active_requests;

        const modelsEl = document.getElementById("models");
        if (status.models.length > 0) {
          modelsEl.innerHTML = '<div class="label">Models</div>' +
            status.models.map(m => '<span class="model-tag">' + m + '</span>').join("");
        } else {
          modelsEl.innerHTML = "";
        }
      } catch (e) {
        console.error("Failed to get status:", e);
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
