[package]
name = "modelrelay-desktop"
version = "0.1.2"
description = "Native desktop tray app for ModelRelay workers"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "modelrelay-desktop"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
modelrelay-worker = { path = "../modelrelay-worker" }
modelrelay-protocol = { path = "../modelrelay-protocol" }

[lints]
workspace = true
