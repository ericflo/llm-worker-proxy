name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}

      - name: Write App Store Connect API key to disk (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/appstore"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/appstore/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/appstore/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and bundle with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sign updater artifacts so the desktop app's updater plugin will
          # accept them. The private key is generated once with
          # `cargo tauri signer generate` and stored in repo Actions secrets.
          # See docs/auto-updates.md for setup.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization (macOS only — other
          # platforms ignore these). Without them, downloaded .dmgs trip
          # Gatekeeper with "ModelRelay is damaged and can't be opened."
          # tauri-action creates a temp keychain, imports the cert, signs
          # with hardened runtime, submits to notarytool, waits, and
          # staples the bundle automatically.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH is exported by the "Write ... key to disk" step above.
        with:
          projectPath: crates/modelrelay-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ModelRelay Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## ModelRelay Desktop ${{ github.ref_name }}

            The app will auto-update from this release. For a fresh install,
            download the installer for your platform below.

            | Platform | File |
            |----------|------|
            | Linux | `.deb`, `.AppImage` |
            | macOS | `.dmg` |
            | Windows | `.msi`, `.exe` |

            Auto-updater bundles (`.app.tar.gz`, `.AppImage`, `-setup.exe`)
            and their `.sig` files are also uploaded — these are consumed by
            the in-app updater via https://modelrelay.io/updater/desktop/...
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
